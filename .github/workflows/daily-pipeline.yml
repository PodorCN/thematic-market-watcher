name: Daily Digest

on:
  # TODO: schedule time/timezone not decided yet (see readme/AGENTS.md open TODOs).
  # Uncomment and set a cron once confirmed -- cron is always UTC, so
  # convert from whatever local time you want. Example: 0 0 * * * is
  # 08:00 Beijing time.
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to run for (YYYY-MM-DD), defaults to today (UTC)"
        required: false
        default: ""
      theme:
        description: "Theme to run (all, canadian_banks, us_smallcap, us_rates, tariff_war)"
        required: false
        default: "all"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Resolve date
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: 1. Fetch data
        run: |
          THEME="${{ github.event.inputs.theme || 'all' }}"
          if [ "$THEME" = "all" ]; then
            for t in canadian_banks us_smallcap us_rates tariff_war; do
              echo "fetch_data $t"
              python data/fetch_data.py --date "${{ steps.vars.outputs.date }}" --theme "$t"
            done
          else
            python data/fetch_data.py --date "${{ steps.vars.outputs.date }}" --theme "$THEME"
          fi

      - name: 2. Collect & judge headlines
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          THEME="${{ github.event.inputs.theme || 'all' }}"
          if [ "$THEME" = "all" ]; then
            for t in canadian_banks us_smallcap us_rates tariff_war; do
              echo "candidates+judge $t"
              python news/fetch_candidates.py --date "${{ steps.vars.outputs.date }}" --theme "$t"
              python news/judge.py --date "${{ steps.vars.outputs.date }}" --theme "$t"
            done
          else
            python news/fetch_candidates.py --date "${{ steps.vars.outputs.date }}" --theme "$THEME"
            python news/judge.py --date "${{ steps.vars.outputs.date }}" --theme "$THEME"
          fi

      - name: 3. Analyze
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          THEME="${{ github.event.inputs.theme || 'all' }}"
          if [ "$THEME" = "all" ]; then
            for t in canadian_banks us_smallcap us_rates tariff_war; do
              python theme-engine/analyze.py --date "${{ steps.vars.outputs.date }}" --theme "$t"
            done
          else
            python theme-engine/analyze.py --date "${{ steps.vars.outputs.date }}" --theme "$THEME"
          fi

      - name: 4. Render HTML
        run: |
          THEME="${{ github.event.inputs.theme || 'all' }}"
          if [ "$THEME" = "all" ]; then
            for t in canadian_banks us_smallcap us_rates tariff_war; do
              python render/render.py --date "${{ steps.vars.outputs.date }}" --theme "$t"
            done
          else
            python render/render.py --date "${{ steps.vars.outputs.date }}" --theme "$THEME"
          fi

      - name: Commit results
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add archive/ docs/
          git commit -m "Daily digest ${{ steps.vars.outputs.date }}" || echo "nothing to commit"
          git push
